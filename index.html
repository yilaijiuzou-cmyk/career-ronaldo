<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cristiano Ronaldo Career Journey - S2 Palette</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --ink: #0E2F17;
      --muted: #4A624A;
      --paper: #FFFFFF;
      --panel: #F3FAEF;
      --line: #B7DFA1;
      --accent: #2F8F3A;
      --accent-dark: #176B2C;
      --route: #7BC043;
      --gold: #FFD23F;
      --sky: #F3FAEF;
      --shadow: 0 18px 50px rgba(23, 107, 44, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      background: var(--paper);
    }

    #map {
      width: 100%;
      height: 100%;
      background: #DDEED4;
    }

    .leaflet-container {
      font: inherit;
      background: #DDEED4;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }

    .brand {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 600;
      max-width: 250px;
      padding: 10px 13px 11px;
      border: 1px solid rgba(216, 163, 26, 0.34);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 22px rgba(14, 47, 23, 0.12);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .brand__label {
      display: none;
      margin: 0;
      font-size: 10px;
      color: var(--accent-dark);
      font-weight: 700;
      text-transform: uppercase;
    }

    .brand h1 {
      display: grid;
      gap: 4px;
      margin: 0;
      letter-spacing: 0;
    }

    .brand__name {
      color: #0E2F17;
      font-size: 17px;
      line-height: 1.16;
      font-weight: 800;
    }

    .brand__desc {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #6F5A18;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
    }

    .brand__desc::before {
      content: "";
      width: 22px;
      height: 2px;
      border-radius: 999px;
      background: #D8A31A;
    }

    .brand p {
      display: none;
      margin: 4px 0 0;
      max-width: 220px;
      color: #666;
      font-size: 12px;
      line-height: 1.35;
    }

    .panel {
      position: relative;
      z-index: 500;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      height: 100vh;
      padding: 18px;
      --team-main: #D8A31A;
      --team-text: #102015;
      border-left: 1px solid #E6C15D;
      background: #ffffff;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      transition: border-color 260ms ease;
    }

    .stage-kicker {
      margin: 0 0 6px;
      color: var(--team-main);
      font-size: 12px;
      font-weight: 800;
    }

    .stage-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
      letter-spacing: 0;
      color: #0E2F17;
    }

    .stage-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #ffffff;
      border-color: #E6C15D;
      font-size: 12px;
      white-space: nowrap;
    }

    .story {
      min-height: 0;
      margin: 16px -6px 0 0;
      padding-right: 6px;
      overflow: auto;
    }

    .story p {
      margin: 0 0 12px;
      color: #4A624A;
      font-size: 14px;
      line-height: 1.68;
    }

    .moment-list {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .moment-heading {
      margin: 14px 0 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .moment {
      padding: 9px 11px;
      border-left: 3px solid var(--team-main);
      background: #ffffff;
      border-radius: 0 8px 8px 0;
    }

    .moment time {
      display: block;
      margin-bottom: 2px;
      color: var(--team-main);
      font-size: 12px;
      font-weight: 800;
    }

    .moment span {
      color: #0E2F17;
      font-size: 13px;
      line-height: 1.42;
    }

    .stage-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 7px;
      margin: 18px 0 0;
    }

    .stage-dot {
      height: 5px;
      border: 0;
      border-radius: 999px;
      background: #E6C15D;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
    }

    .stage-dot.is-active {
      background: #D8A31A;
      transform: scaleY(1.7);
    }

    .stage-dot.is-past {
      background: #D8A31A;
    }

    .controls {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 10px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .icon-button,
    .play-button {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #F3FAEF;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .icon-button {
      display: grid;
      place-items: center;
      border-color: #E6C15D;
      color: #D8A31A;
      background: #ffffff;
      font-size: 20px;
      line-height: 1;
    }

    .play-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      color: var(--team-text);
      border-color: var(--team-main);
      background: var(--team-main);
    }

    .icon-button:hover,
    .play-button:hover {
      transform: translateY(-1px);
    }

    .icon-button:hover {
      border-color: #D8A31A;
      background: #FFF8E6;
    }

    .icon-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .chapter-rail {
      display: none;
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 600;
      gap: 6px;
      width: min(330px, calc(100vw - 460px));
    }

    .chapter-button {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      padding: 5px 9px 5px 5px;
      border: 1px solid #E6C15D;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(20, 20, 20, 0.08);
      cursor: pointer;
      text-align: left;
      backdrop-filter: blur(10px);
    }

    .chapter-button.is-active {
      border-color: var(--team-main);
      background: #ffffff;
    }

    .chapter-number {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: var(--route);
      font-size: 12px;
      font-weight: 800;
    }

    .chapter-button.is-active .chapter-number {
      transform: scale(1.04);
    }

    .chapter-main strong {
      display: block;
      font-size: 12px;
      line-height: 1.2;
    }

    .chapter-main span,
    .chapter-year {
      color: var(--muted);
      font-size: 11px;
    }

    .city-label {
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: #145A24;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.98), 0 0 6px rgba(255, 255, 255, 0.92);
      white-space: nowrap;
      pointer-events: none;
    }

    .city-pin {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(20, 20, 20, 0.28);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      transition: transform 220ms ease, opacity 220ms ease;
    }

    .city-pin.is-active {
      animation: pin-pop 420ms ease;
    }

    .city-pin.is-active::after {
      content: "";
      position: absolute;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(189, 47, 47, 0.55);
      border-radius: 50%;
      animation: pin-pulse 1.8s ease-out infinite;
    }

    @keyframes pin-pop {
      0% {
        transform: scale(0.7);
      }
      70% {
        transform: scale(1.16);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes pin-pulse {
      0% {
        opacity: 0.7;
        transform: scale(0.55);
      }
      100% {
        opacity: 0;
        transform: scale(1.15);
      }
    }

    .city-pin.is-muted {
      transform: scale(0.76);
    }

    .route-light {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.28), 0 4px 14px rgba(0, 0, 0, 0.24);
    }

    .route-runner {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      line-height: 1;
      filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.28));
      perspective: 120px;
    }

    .route-ball {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      overflow: hidden;
      background: transparent;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.24);
      transform-style: preserve-3d;
    }

    .route-ball img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .route-ball::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.9) 0 12%, transparent 28%);
      pointer-events: none;
    }

    .route-ball::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: inset -7px -8px 9px rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }

    .achievement-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .achievement-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      border-color: #E6C15D;
    }

    .achievement-row strong {
      color: var(--team-main);
      font-size: 12px;
    }

    .achievement-row span {
      color: #0E2F17;
      font-size: 13px;
      line-height: 1.38;
    }

    .mobile-handle {
      display: none;
    }

    .mobile-play-float {
      display: none;
    }

    .achievement-strip {
      display: none;
    }

    @media (max-width: 920px) {
      body {
        overflow: hidden;
      }

      .app {
        display: block;
      }

      #map {
        height: 100vh;
      }

      .brand {
        top: 14px;
        left: 14px;
        right: auto;
        max-width: none;
        width: auto;
        padding: 8px 10px 9px;
        border: 1px solid rgba(216, 163, 26, 0.34);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 20px rgba(14, 47, 23, 0.1);
        backdrop-filter: blur(10px);
      }

      .brand__label {
        margin-bottom: 5px;
      }

      .brand h1 {
        gap: 3px;
      }

      .brand__name {
        font-size: 14px;
      }

      .brand__desc {
        gap: 6px;
        font-size: 10px;
      }

      .brand__desc::before {
        width: 18px;
      }

      .brand p {
        display: none;
      }

      .leaflet-bottom.leaflet-left {
        left: auto;
        right: 12px;
        bottom: auto;
        top: 88px;
      }

      .chapter-rail {
        display: none;
      }

      .panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: min(54vh, 460px);
        padding: 14px 16px 16px;
        border-top: 1px solid var(--line);
        border-left: 0;
        border-radius: 8px 8px 0 0;
        transform: translateY(calc(100% - 175px));
        transition: transform 220ms ease;
      }

      .panel.is-open {
        transform: translateY(0);
      }

      .panel.is-open ~ .mobile-play-float {
        display: none;
      }

      .mobile-handle {
        display: block;
        width: 44px;
        height: 5px;
        margin: 0 auto 12px;
        border-radius: 999px;
        border: 0;
        background: #93C96B;
        cursor: pointer;
      }

      .stage-title {
        font-size: 21px;
      }

      .stage-meta {
        display: none;
      }

      .stage-strip {
        display: none;
      }

      .story {
        margin-top: 14px;
      }

      .story p {
        font-size: 14px;
        line-height: 1.72;
        margin-bottom: 12px;
      }

      .moment-list {
        margin-top: 12px;
      }

      .moment {
        padding: 10px 12px;
      }

      .controls {
        grid-template-columns: 42px 1fr 42px;
        padding-top: 12px;
      }

      .mobile-play-float {
        display: grid;
        place-items: center;
        position: fixed;
        right: auto;
        left: 14px;
        bottom: 185px;
        z-index: 700;
        width: 52px;
        height: 52px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #2F8F3A;
        color: #fff;
        font-size: 22px;
        box-shadow: 0 6px 20px rgba(15, 55, 20, 0.35);
        cursor: pointer;
        transition: transform 180ms ease, background 180ms ease;
      }

      .mobile-play-float.is-playing {
        background: #176B2C;
      }

      .mobile-play-float:active {
        transform: scale(0.94);
      }

      .achievement-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
      }

      .achievement-strip .strip-item {
        padding: 6px 8px;
        border: 1px solid #E6C15D;
        border-radius: 6px;
        text-align: center;
        background: #FFFAED;
      }

      .achievement-strip .strip-item strong {
        display: block;
        color: #D8A31A;
        font-size: 10px;
        font-weight: 700;
        margin-bottom: 2px;
      }

      .achievement-strip .strip-item span {
        display: block;
        color: #0E2F17;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.25;
      }

      .moment.mobile-hide {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="map" aria-label="Cristiano Ronaldo career map"></section>

    <header class="brand">
      <p class="brand__label">Cristiano Ronaldo Career Journey</p>
      <h1>
        <span class="brand__name">克里斯蒂亚诺·罗纳尔多</span>
        <span class="brand__desc">职业生涯轨迹图</span>
      </h1>
    </header>

    <nav class="chapter-rail" id="chapterRail" aria-label="职业阶段"></nav>

    <aside class="panel" id="storyPanel">
      <button class="mobile-handle" id="mobileHandle" aria-label="展开或收起"></button>
      <section>
        <p class="stage-kicker" id="stageKicker"></p>
        <h2 class="stage-title" id="stageTitle"></h2>
        <div class="stage-meta" id="stageMeta"></div>
        <div class="achievement-strip" id="achievementStrip"></div>
        <div class="stage-strip" id="stageStrip"></div>
      </section>
      <section class="story" id="stageStory"></section>
      <footer class="controls">
        <button class="icon-button" id="prevBtn" aria-label="上一站">‹</button>
        <button class="play-button" id="playBtn" aria-label="播放职业轨迹">
          <span id="playIcon">▶</span>
          <span id="playText">播放轨迹</span>
        </button>
        <button class="icon-button" id="nextBtn" aria-label="下一站">›</button>
      </footer>
    </aside>

    <button class="mobile-play-float" id="mobilePlayFloat" aria-label="播放轨迹">
      <span id="mobilePlayIcon">▶</span>
    </button>
  </main>

  <script>

    let current = 0;

    const map = L.map("map", {
      zoomControl: false,

    });

    L.control.zoom({ position: "bottomleft" }).addTo(map);

    const overviewLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,

    }).addTo(map);

    const tiandituKey = typeof TIANDITU_TK === "string" ? TIANDITU_TK : "";
    let tiandituBase = null;
    let tiandituLabels = null;
    if (tiandituKey) {
      tiandituBase = L.tileLayer("https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=" + tiandituKey, {
        subdomains: ["0", "1", "2", "3", "4", "5", "6", "7"],
        maxZoom: 18,
        opacity: 1,
        attribution: "&copy; 天地图"
      }).addTo(map);
      tiandituLabels = L.tileLayer("https://t{s}.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=" + tiandituKey, {
        subdomains: ["0", "1", "2", "3", "4", "5", "6", "7"],
        maxZoom: 18,
        opacity: 1,
        attribution: ""
      }).addTo(map);
    }

    function syncBaseLayerOpacity() {
      if (!tiandituBase || !tiandituLabels) return;
      tiandituBase.setOpacity(1);
      tiandituLabels.setOpacity(1);
      overviewLayer.setOpacity(0);
    }

    map.on("zoomend", syncBaseLayerOpacity);

    function pinIcon(stage, index, active) {
      const fill = stage.colors.primary;
      const stroke = stage.colors.secondary;
      const textColor = stage.colors.primary === "#FFFFFF" ? "#222" : "#fff";
      return L.divIcon({
        className: "",
        html: `<div class="city-pin${active ? " is-active" : " is-muted"}" style="background:${fill};border-color:${stroke};color:${textColor}">${index + 1}</div>`,
        iconSize: [42, 42],
        iconAnchor: [21, 21]
      });
    }

    function labelIcon(stage) {
      return L.divIcon({
        className: "",
        html: `<div class="city-label">${stage.club}</div>`,
        iconAnchor: [-8, -18]
      });
    }

    function buildMapObjects() {
      stages.forEach((stage, index) => {
        const marker = L.marker([stage.lat, stage.lon], {
          icon: pinIcon(stage, index, index === current),
          keyboard: true
        }).addTo(map);
        marker.on("click", () => setStage(index, true));
        markers.push(marker);

        const label = L.marker([stage.lat, stage.lon], {
          icon: labelIcon(stage),
          interactive: false
        }).addTo(map);
        labels.push(label);

        if (index < stages.length - 1) {
          const next = stages[index + 1];
          const route = L.polyline(
            [[stage.lat, stage.lon], [next.lat, next.lon]],
            {
              color: "#7BC043",
              weight: 5,
              opacity: 0,
              lineCap: "round"
            }
          ).addTo(map);
          routes.push(route);

          const progress = L.polyline(
            [[stage.lat, stage.lon]],
            {
              color: "#7BC043",
              weight: 6,
              opacity: 0,
              lineCap: "round"
            }
          ).addTo(map);
          routeProgress.push(progress);
        }
      });
    }

    function renderNavigation() {
      const rail = document.getElementById("chapterRail");
      const strip = document.getElementById("stageStrip");

      rail.innerHTML = stages.map((stage, index) => `
        <button class="chapter-button" data-index="${index}" aria-label="${stage.city} ${stage.period}">
          <span class="chapter-number" style="background:${stage.colors.primary};border:2px solid ${stage.colors.secondary};color:${stage.colors.primary === "#FFFFFF" ? "#222" : "#fff"}">${index + 1}</span>
          <span class="chapter-main">
            <strong>${stage.city}</strong>
            <span>${stage.club}</span>
          </span>
          <span class="chapter-year">${stage.period}</span>
        </button>
      `).join("");

      strip.innerHTML = stages.map((stage, index) => `
        <button class="stage-dot" data-index="${index}" aria-label="${stage.city}"></button>
      `).join("");

      document.querySelectorAll("[data-index]").forEach((button) => {
        const moveMap = !button.classList.contains("stage-dot");
        button.addEventListener("click", () => setStage(Number(button.dataset.index), moveMap));
      });
    }

    function fitOpeningView(animated = false) {
      const bounds = L.latLngBounds(stages.map((stage) => [stage.lat, stage.lon]));
      if (window.innerWidth <= 920) {
        map.fitBounds(bounds, {
          paddingTopLeft: [70, 24],
          paddingBottomRight: [200, 24],
          maxZoom: 5,
          animate: animated
        });
        syncBaseLayerOpacity();
        openingView = {
          center: map.getCenter(),
          zoom: map.getZoom()
        };
        return;
      }
      map.fitBounds(bounds, {
        paddingTopLeft: [42, 58],
        paddingBottomRight: [42, 58],
        maxZoom: 4,
        animate: animated
      });
      openingView = {
        center: map.getCenter(),
        zoom: map.getZoom()
      };
    }

    function fitCareerBoundsForFinalStage(animated) {
      if (!openingView) {
        fitOpeningView(false);
      } else {
        map.setView(openingView.center, openingView.zoom, {
          animate: animated,
          duration: animated ? 1.2 : 0
        });
      }
      syncBaseLayerOpacity();
    }

    function renderInfo(data) {
      document.getElementById("stageKicker").textContent = data.kicker;
      document.getElementById("stageTitle").textContent = data.title;
      document.getElementById("stageMeta").innerHTML = data.meta.map((item) => `<span class="pill">${item}</span>`).join("");

      const strip = document.getElementById("achievementStrip");
      if (data.achievements && data.achievements.length >= 4) {
        const compactItems = [
          data.achievements[1],
          data.achievements[2],
          data.achievements[3]
        ];
        strip.innerHTML = compactItems.map((item) => `
          <div class="strip-item">
            <strong>${item[0]}</strong>
            <span>${item[1]}</span>
          </div>
        `).join("");
      } else {
        strip.innerHTML = "";
      }

      document.getElementById("stageStory").innerHTML = `
        ${data.summary ? `<p>${data.summary}</p>` : ""}
        <h3 class="moment-heading">${data.achievementsTitle}</h3>
        <div class="achievement-list">
          ${data.achievements.map((item) => `
            <div class="achievement-row">
              <strong>${item[0]}</strong>
              <span>${item[1]}</span>
            </div>
          `).join("")}
        </div>
        ${data.moments && data.moments.length ? `<div class="moment-list">
          ${data.moments.map((moment) => `
            <div class="moment${moment[2] ? ' ' + moment[2] : ''}">
              <time>${moment[0]}</time>
              <span>${moment[1]}</span>
            </div>
          `).join("")}
        </div>` : ""}
      `;
    }

    function renderOverview() {
      renderInfo(careerOverview);
      document.querySelectorAll(".chapter-button").forEach((button) => button.classList.remove("is-active"));
      document.querySelectorAll(".stage-dot").forEach((button) => {
        button.classList.remove("is-active");
        button.classList.remove("is-past");
      });
      markers.forEach((marker, i) => {
        marker.setIcon(pinIcon(stages[i], i, false));
        marker.setOpacity(1);
      });
      labels.forEach((label) => label.setOpacity(0));
      routes.forEach((route) => route.setStyle({ opacity: 0, weight: 5, color: "#7BC043" }));
      routeProgress.forEach((route, i) => {
        const from = stages[i];
        route.setLatLngs([[from.lat, from.lon]]);
        route.setStyle({ opacity: 0, weight: 6, color: "#7BC043" });
      });
      document.getElementById("prevBtn").disabled = true;
      document.getElementById("nextBtn").disabled = false;
    }

    function setStage(index, moveMap) {
      current = Math.max(0, Math.min(stages.length - 1, index));
      const stage = stages[current];

      renderInfo({
        kicker: `第 ${current + 1} 站 · ${stage.period}`,
        title: stage.title,
        meta: [`${stage.city}，${stage.country}`, stage.club, stage.period],
        summary: "",
        achievementsTitle: stage.achievementsTitle,
        achievements: stage.achievements,
        moments: stage.moments
      });

      document.querySelectorAll(".chapter-button").forEach((button, i) => {
        button.classList.toggle("is-active", i === current);
      });

      document.querySelectorAll(".stage-dot").forEach((button, i) => {
        button.classList.toggle("is-active", i === current);
        button.classList.toggle("is-past", i < current);
      });

      markers.forEach((marker, i) => {
        marker.setIcon(pinIcon(stages[i], i, i === current));
        marker.setOpacity(1);
        if (i === current) marker.setZIndexOffset(1000);
        else marker.setZIndexOffset(i <= current ? 300 + i : i);
      });

      labels.forEach((label, i) => {
        label.setOpacity(i <= current ? 1 : 0);
      });

      routes.forEach((route, i) => {
        route.setStyle({ opacity: 0, weight: 5, color: "#7BC043" });
      });

      routeProgress.forEach((route, i) => {
        const from = stages[i];
        const to = stages[i + 1];
        if (i < current) {
          route.setLatLngs([[from.lat, from.lon], [to.lat, to.lon]]);
          route.setStyle({ opacity: 1, weight: 6, color: "#7BC043" });
        } else {
          route.setLatLngs([[from.lat, from.lon]]);
          route.setStyle({ opacity: 0, weight: 6, color: "#7BC043" });
        }
      });

      document.getElementById("prevBtn").disabled = current === 0;
      document.getElementById("nextBtn").disabled = current === stages.length - 1;

      if (moveMap) {
        map.stop();
        if (current === stages.length - 1) {
          fitCareerBoundsForFinalStage(false);
        } else {
          map.panTo([stage.lat, stage.lon], {
            animate: true,
            duration: 1.55,
            easeLinearity: 0.18
          });
        }
      }
    }

    function interpolatePosition(from, to, progress) {
      return [
        from.lat + (to.lat - from.lat) * progress,
        from.lon + (to.lon - from.lon) * progress
      ];
    }

    let lastCameraFollow = 0;

    function followRunnerIfNeeded(latlng, now) {
      const point = map.latLngToContainerPoint(latlng);
      const size = map.getSize();
      const center = L.point(size.x / 2, size.y / 2);
      const distance = point.distanceTo(center);
      const threshold = Math.min(size.x, size.y) * 0.36;

      if (distance > threshold && now - lastCameraFollow > 520) {
        lastCameraFollow = now;
        map.panTo(latlng, {
          animate: true,
          duration: 0.55,
          easeLinearity: 0.22
        });
      }
    }

    function ensureRouteLight() {
      if (!routeLight) {
        routeLight = L.marker([stages[0].lat, stages[0].lon], {
          icon: L.divIcon({
            className: "",
            html: '<div class="route-light"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          }),
          interactive: false,
          opacity: 0
        }).addTo(map);
      }
      return routeLight;
    }

    function ensureRouteRunner() {
      if (!routeRunner) {
        routeRunner = L.marker([stages[0].lat, stages[0].lon], {
          icon: L.divIcon({
            className: "",
            html: '<div class="route-runner"><div class="route-ball" aria-hidden="true"><img src="assets/soccer-ball-marker.png" alt=""></div></div>',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          }),
          interactive: false,
          opacity: 0
        }).addTo(map);
      }
      return routeRunner;
    }

    function animateTravel(fromIndex, toIndex, done) {
      if (travelAnimation) window.cancelAnimationFrame(travelAnimation);
      isTraveling = true;
      const from = stages[fromIndex];
      const to = stages[toIndex];
      const light = ensureRouteLight();
      const runner = ensureRouteRunner();
      const duration = fromIndex === 5 ? 3600 : 2600;
      const started = performance.now();
      const progressRoute = routeProgress[fromIndex];
      const shouldHoldCamera = fromIndex < 5;
      const shouldSmoothPan = fromIndex === 5;

      map.stop();
      lastCameraFollow = started;
      if (shouldSmoothPan) {
        fitCareerBoundsForFinalStage(false);
      }

      if (routes[fromIndex]) {
        routes[fromIndex].setStyle({ opacity: 0, weight: 5, color: "#7BC043" });
      }
      if (progressRoute) {
        progressRoute.setStyle({ opacity: 1, weight: 7, color: "#7BC043" });
        progressRoute.setLatLngs([[from.lat, from.lon]]);
      }

      light.setOpacity(1);
      light.setLatLng([from.lat, from.lon]);
      runner.setOpacity(1);
      runner.setLatLng([from.lat, from.lon]);

      function step(now) {
        const raw = Math.min(1, (now - started) / duration);
        const eased = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
        const position = interpolatePosition(from, to, eased);
        light.setLatLng(position);
        runner.setLatLng(position);
        if (!shouldHoldCamera && !shouldSmoothPan) {
          followRunnerIfNeeded(position, now);
        }
        if (progressRoute) {
          progressRoute.setLatLngs([[from.lat, from.lon], position]);
        }
        if (raw < 1) {
          travelAnimation = window.requestAnimationFrame(step);
        } else {
          light.setOpacity(0);
          runner.setOpacity(0);
          if (progressRoute) {
            progressRoute.setLatLngs([[from.lat, from.lon], [to.lat, to.lon]]);
            progressRoute.setStyle({ opacity: 1, weight: 6, color: "#7BC043" });
          }
          travelAnimation = null;
          isTraveling = false;
          if (shouldSmoothPan) {
            syncBaseLayerOpacity();
          }
          done();
        }
      }

      travelAnimation = window.requestAnimationFrame(step);
    }

    function animateBacktrack(fromIndex, toIndex, done) {
      if (travelAnimation) window.cancelAnimationFrame(travelAnimation);
      isTraveling = true;
      const from = stages[fromIndex];
      const to = stages[toIndex];
      const light = ensureRouteLight();
      const runner = ensureRouteRunner();
      const segmentIndex = toIndex;
      const duration = segmentIndex === 5 ? 3600 : 2600;
      const started = performance.now();
      const progressRoute = routeProgress[segmentIndex];

      map.stop();

      if (progressRoute) {
        progressRoute.setStyle({ opacity: 1, weight: 7, color: "#7BC043" });
        progressRoute.setLatLngs([[to.lat, to.lon], [from.lat, from.lon]]);
      }

      light.setOpacity(1);
      light.setLatLng([from.lat, from.lon]);
      runner.setOpacity(1);
      runner.setLatLng([from.lat, from.lon]);

      function step(now) {
        const raw = Math.min(1, (now - started) / duration);
        const eased = raw < 0.5 ? 2 * raw * raw : 1 - Math.pow(-2 * raw + 2, 2) / 2;
        const position = interpolatePosition(from, to, eased);
        light.setLatLng(position);
        runner.setLatLng(position);
        if (progressRoute) {
          progressRoute.setLatLngs([[to.lat, to.lon], position]);
        }
        if (raw < 1) {
          travelAnimation = window.requestAnimationFrame(step);
        } else {
          light.setOpacity(0);
          runner.setOpacity(0);
          if (progressRoute) {
            progressRoute.setLatLngs([[to.lat, to.lon]]);
            progressRoute.setStyle({ opacity: 0, weight: 6, color: "#7BC043" });
          }
          travelAnimation = null;
          isTraveling = false;
          done();
        }
      }

      travelAnimation = window.requestAnimationFrame(step);
    }

    function nextStage() {
      if (isTraveling) return;
      if (current < stages.length - 1) {
        const from = current;
        const to = current + 1;
        animateTravel(from, to, () => setStage(to, false));
      } else {
        stopPlayback();
      }
    }

    function previousStage(moveMap = true) {
      if (isTraveling) return;
      if (current > 0) {
        const from = current;
        const to = current - 1;
        animateBacktrack(from, to, () => setStage(to, moveMap));
      }
    }

    function startPlayback() {
      const shouldRestart = !hasStartedJourney || current >= stages.length - 1;
      playing = true;
      hasStartedJourney = true;
      updatePlayButtons();
      if (shouldRestart) {
        current = 0;
        setStage(0, false);
      } else {
        setStage(current, false);
      }
      nextStage();
      playTimer = window.setInterval(nextStage, 4600);
    }

    function stopPlayback() {
      playing = false;
      window.clearInterval(playTimer);
      playTimer = null;
      if (travelAnimation) {
        window.cancelAnimationFrame(travelAnimation);
        travelAnimation = null;
      }
      isTraveling = false;
      if (routeLight) routeLight.setOpacity(0);
      if (routeRunner) routeRunner.setOpacity(0);
      setStage(current, false);
      if (current === stages.length - 1) {
        fitCareerBoundsForFinalStage(false);
      }
      updatePlayButtons();
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      stopPlayback();
      if (!hasStartedJourney) {
        hasStartedJourney = true;
        setStage(0, false);
        return;
      }
      nextStage();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      stopPlayback();
      hasStartedJourney = true;
      previousStage(false);
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      if (playing) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    document.getElementById("mobilePlayFloat").addEventListener("click", () => {
      if (playing) {
        stopPlayback();
      } else {
        startPlayback();
      }
    });

    function updatePlayButtons() {
      const icon = playing ? "❚❚" : "▶";
      document.getElementById("playIcon").textContent = icon;
      document.getElementById("playText").textContent = playing ? "暂停" : "播放轨迹";
      document.getElementById("mobilePlayIcon").textContent = icon;
      const floatBtn = document.getElementById("mobilePlayFloat");
      if (playing) {
        floatBtn.classList.add("is-playing");
      } else {
        floatBtn.classList.remove("is-playing");
      }
    }

    document.getElementById("mobileHandle").addEventListener("click", () => {
      document.getElementById("storyPanel").classList.toggle("is-open");
      setTimeout(() => map.invalidateSize(), 250);
    });

    window.addEventListener("resize", () => {
      setTimeout(() => {
        map.invalidateSize();
        if (current === 0 && !playing) {
          if (hasStartedJourney) setStage(current, true);
          else fitOpeningView();
        } else {
          setStage(current, true);
        }
      }, 120);
    });

    buildMapObjects();
    renderNavigation();
    fitOpeningView();
    syncBaseLayerOpacity();
    renderOverview();
    window.setTimeout(() => {
      map.invalidateSize();
      fitOpeningView();
      renderOverview();
    }, 120);
  </script>
</body>
</html>
